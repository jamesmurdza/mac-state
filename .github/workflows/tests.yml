name: tests
on: [push, pull_request]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - name: Fail on permanently-skipped tests
        run: |
          if grep -rnE "\b(it|test|describe)\.skip\(" tests/ src/ 2>/dev/null; then
            echo "Skipped tests found — skipped is failing"; exit 1
          fi

  e2e:
    # Needs repo secrets USE_COMPUTER_API_KEY and USE_COMPUTER_RESERVATION_ID (an active reservation).
    # Without them the job fails on purpose; the suite never skips.
    runs-on: ubuntu-latest
    needs: unit
    env:
      USE_COMPUTER_API_KEY: ${{ secrets.USE_COMPUTER_API_KEY }}
      USE_COMPUTER_RESERVATION_ID: ${{ secrets.USE_COMPUTER_RESERVATION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshots, path: test-results/ }
