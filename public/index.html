<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mac-state</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0e0c; --panel: #1b1916; --line: #2c2823; --line-2: #3a342d;
    --ink: #ece6da; --ink-2: #a89f91; --ink-3: #6f675c;
    --amber: #f0a830; --amber-2: #ffcf7a; --red: #f06a5a; --green: #7fd68a;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --serif: "Instrument Serif", Georgia, serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--ink); font: 13px/1.5 var(--mono);
    background: radial-gradient(1200px 600px at 20% -10%, #24201a 0%, var(--bg) 55%) fixed, var(--bg);
  }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 18px; padding: 18px 28px 12px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font: italic 400 34px/1 var(--serif); color: var(--amber-2); }
  .meta { display: flex; flex-wrap: wrap; gap: 16px; align-items: baseline; color: var(--ink-2); font-size: 12px; }
  .meta a { color: var(--amber); text-decoration: none; border-bottom: 1px dotted var(--amber); }
  .live { display: inline-flex; align-items: center; gap: 6px; text-transform: uppercase; letter-spacing: .12em; font-size: 10px; }
  .live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
  .live.on::before { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .live.busy::before { background: var(--amber); animation: pulse .9s infinite alternate; }
  @keyframes pulse { from { opacity: .35 } to { opacity: 1 } }
  main { display: grid; grid-template-columns: minmax(0, 3fr) minmax(360px, 2fr); gap: 24px; padding: 22px 28px 32px; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
  .monitor {
    background: #060605; border: 1px solid var(--line-2); border-radius: 10px; padding: 10px; align-self: start;
    box-shadow: 0 30px 60px -30px rgba(0, 0, 0, .9), inset 0 0 0 1px #000;
  }
  .monitor iframe { display: block; width: 100%; aspect-ratio: 16 / 9; border: 0; background: #000; border-radius: 4px; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 4px 0; color: var(--ink-3); font-size: 11px; }
  .bar a { color: var(--amber); text-decoration: none; border-bottom: 1px dotted var(--amber); }
  .console { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  label { display: block; text-transform: uppercase; letter-spacing: .14em; font-size: 10px; color: var(--ink-2); margin-bottom: 6px; }
  textarea {
    width: 100%; min-height: 96px; resize: vertical; background: var(--panel); color: var(--ink);
    border: 1px solid var(--line-2); border-radius: 6px; padding: 10px 12px; font: inherit;
  }
  textarea:focus { outline: none; border-color: var(--amber); box-shadow: 0 0 0 3px rgba(240, 168, 48, .15); }
  .actions { display: flex; align-items: center; gap: 12px; }
  button { font: inherit; font-weight: 600; padding: 9px 16px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--panel); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--amber); color: #1a1205; border-color: var(--amber); }
  button.primary:hover { background: var(--amber-2); }
  button:disabled { opacity: .5; cursor: progress; }
  kbd { font: inherit; color: var(--ink-3); }
  #status { margin-left: auto; color: var(--ink-2); text-align: right; }
  #status.error { color: var(--red); }
  .result { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .result h2 {
    display: flex; justify-content: space-between; margin: 0; padding: 7px 12px; border-bottom: 1px solid var(--line);
    font: 500 10px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2);
  }
  pre { margin: 0; padding: 10px 12px; min-height: 24px; max-height: 320px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
  pre:empty::before { content: "—"; color: var(--ink-3); }
  #stderr { color: var(--red); }
  #exit-code.ok { color: var(--green); }
  #exit-code.bad { color: var(--red); }
</style>
</head>
<body>
<header>
  <h1>mac-state</h1>
  <div class="meta">
    <span class="live" id="live">sandbox</span>
    <span id="sandbox">connecting…</span>
  </div>
</header>
<main>
  <section class="monitor">
    <iframe id="vnc" title="Sandbox screen (live VNC)" allow="clipboard-read; clipboard-write"></iframe>
    <div class="bar">
      <span id="view-info">creating sandbox…</span>
      <a id="vnc-tab" href="#" target="_blank" rel="noopener" hidden>open in a new tab ↗</a>
    </div>
  </section>
  <section class="console">
    <div>
      <label for="prompt">What should the Mac do?</label>
      <textarea id="prompt" placeholder="Open TextEdit and type hello" spellcheck="false"></textarea>
    </div>
    <div class="actions">
      <button id="run" class="primary" type="button">Run</button>
      <kbd>Ctrl+Enter</kbd>
      <span id="status">idle</span>
    </div>
    <div class="result"><h2>AppleScript <span id="model">claude-opus-5</span></h2><pre id="script"></pre></div>
    <div class="result"><h2>stdout <span>exit <b id="exit-code">–</b></span></h2><pre id="stdout"></pre></div>
    <div class="result"><h2>stderr</h2><pre id="stderr"></pre></div>
  </section>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const live = $("live");

  function setStatus(text, error = false) {
    $("status").textContent = text;
    $("status").classList.toggle("error", error);
  }

  // The sandbox is created on this first request; then the gateway's noVNC viewer is embedded.
  async function loadStatus() {
    live.classList.add("busy");
    try {
      const res = await fetch("/api/status");
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      $("sandbox").textContent = `${data.sandboxId} · ${data.host}`;
      $("vnc").src = data.vncUrl;
      $("vnc-tab").href = data.vncUrl;
      $("vnc-tab").hidden = false;
      $("view-info").textContent = "live · noVNC · click inside to use the Mac directly";
      live.classList.remove("busy");
      live.classList.add("on");
    } catch (err) {
      live.classList.remove("busy", "on");
      $("sandbox").textContent = `error: ${err.message}`;
      $("view-info").textContent = "no sandbox — is the server running with a valid reservation?";
    }
  }

  async function run() {
    const prompt = $("prompt").value.trim();
    if (!prompt) { setStatus("type a prompt first", true); return; }
    $("run").disabled = true;
    setStatus("thinking…");
    $("exit-code").textContent = "–";
    $("exit-code").className = "";
    try {
      const res = await fetch("/api/run", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt }),
      });
      const data = await res.json();
      if (!res.ok) { setStatus(data.error, true); return; }
      $("script").textContent = data.script;
      $("model").textContent = data.model;
      $("stdout").textContent = data.stdout;
      $("stderr").textContent = data.stderr;
      $("exit-code").textContent = data.exitCode;
      $("exit-code").className = data.exitCode === 0 ? "ok" : "bad";
      setStatus(data.exitCode === 0 ? "done" : `script failed (exit ${data.exitCode})`, data.exitCode !== 0);
    } catch (err) {
      setStatus(err.message, true);
    } finally {
      $("run").disabled = false;
    }
  }

  $("run").addEventListener("click", run);
  $("prompt").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(); }
  });

  loadStatus();
</script>
</body>
</html>
