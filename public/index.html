<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mac-state</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/applescript.min.js"></script>
<style>
  :root {
    --bg: #f6f3ee; --panel: #ffffff; --panel-2: #efeae1;
    --line: #e4ddd0; --line-2: #d9cfbd;
    --ink: #211b12; --ink-2: #6e6455; --ink-3: #a89c88;
    --accent: #0072d6; --accent-ink: #ffffff;
    --red: #b8402c; --green: #2f8f52; --blue: #2f6fb0;
    --bubble-user: #eee5d6; --bubble-assistant: #ffffff;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --shadow: 0 1px 2px rgba(30, 24, 12, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #100f0d; --panel: #1a1815; --panel-2: #221f1a;
      --line: #2c2823; --line-2: #3a342c;
      --ink: #ece6da; --ink-2: #a89f91; --ink-3: #6f675c;
      --accent: #4fa8ff; --accent-ink: #06213b;
      --red: #f0796a; --green: #7fd68a; --blue: #8ec5ff;
      --bubble-user: #262219; --bubble-assistant: #1a1815;
      --shadow: 0 1px 2px rgba(0, 0, 0, .5);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--ink); font: 14.5px/1.55 var(--mono); background: var(--bg);
  }
  .app { display: grid; grid-template-columns: minmax(280px, var(--split-col, 58%)) 2px minmax(320px, 1fr); height: 100vh; }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; grid-template-rows: minmax(160px, var(--split-row, 42vh)) 2px minmax(160px, 1fr); height: 100vh; }
  }

  /* ---------- divider: a plain gray strip, no border trick ---------- */
  .divider { background: var(--line-2); z-index: 5; touch-action: none; cursor: col-resize; }
  .divider:hover, .divider.dragging { background: var(--accent); }
  @media (max-width: 860px) {
    .divider { cursor: row-resize; }
  }

  /* ---------- left: VNC stage ---------- */
  .stage { position: relative; background: #000; display: flex; min-width: 0; min-height: 0; }
  .stage iframe { flex: 1; width: 100%; height: 100%; border: 0; background: #000; }
  .vnc-loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; }
  .vnc-loading.hidden { display: none; }
  .vnc-disconnected {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, .6); color: #ece6da; font-family: var(--sans); font-size: 13px; letter-spacing: .02em;
  }
  .vnc-disconnected.hidden { display: none; }
  .spinner {
    width: 30px; height: 30px; border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, .15); border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .chip {
    position: absolute; top: 12px; left: 12px; display: flex; align-items: center; gap: 8px;
    background: rgba(20, 18, 14, .72); backdrop-filter: blur(6px); color: #ece6da;
    border: 1px solid rgba(255, 255, 255, .1); border-radius: 20px; padding: 6px 12px 6px 10px;
    font-size: 11px; letter-spacing: .01em; cursor: pointer;
  }
  .chip:hover { background: rgba(20, 18, 14, .88); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); flex: none; }
  .dot.busy { background: var(--accent); animation: pulse .9s infinite alternate; }
  .dot.on { background: var(--green); }
  .dot.err { background: var(--red); }
  @keyframes pulse { from { opacity: .35 } to { opacity: 1 } }
  /* full-page modal for system info */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
    background: rgba(10, 9, 8, .55); backdrop-filter: blur(2px);
  }
  .modal-overlay.hidden { display: none; }
  .modal {
    position: relative; width: min(420px, calc(100% - 40px)); max-height: calc(100% - 40px); overflow: auto;
    background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 16px;
    padding: 24px 22px; font-family: var(--sans); box-shadow: 0 30px 60px -20px rgba(0, 0, 0, .4);
  }
  .modal h2 { margin: 0 0 16px; font-size: 15px; }
  .modal-close {
    position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; display: grid; place-items: center;
    border: 0; border-radius: 50%; background: transparent; color: var(--ink-3); font-size: 18px; line-height: 1;
    cursor: pointer;
  }
  .modal-close:hover { background: var(--panel-2); color: var(--ink); }
  .modal dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 10px 16px; font-size: 13px; }
  .modal dt { color: var(--ink-3); }
  .modal dd { margin: 0; text-align: right; }
  .modal .note { color: var(--ink-3); font-size: 13px; }
  .vnc-tab {
    position: absolute; top: 12px; right: 12px; display: grid; place-items: center; width: 30px; height: 30px;
    background: rgba(20, 18, 14, .72); backdrop-filter: blur(6px); color: #ece6da;
    border: 1px solid rgba(255, 255, 255, .1); border-radius: 50%; text-decoration: none;
  }
  .vnc-tab:hover { background: rgba(20, 18, 14, .9); }
  .vnc-tab svg { width: 15px; height: 15px; }

  /* ---------- right: chat ---------- */
  .chat { display: flex; flex-direction: column; align-items: center; min-width: 0; min-height: 0; background: var(--bg); font-family: var(--sans); }
  .messages {
    flex: 1; width: 100%; overflow-y: auto; padding: 18px max(16px, (100% - 760px) / 2);
    display: flex; flex-direction: column; gap: 14px;
  }
  .msg { max-width: 92%; }
  .msg-system { align-self: center; max-width: 100%; color: var(--ink-3); font-size: 11px; text-align: center; padding: 2px 0; }
  .msg-system.err { color: var(--red); }
  .msg-user { align-self: flex-end; }
  .msg-assistant { align-self: flex-start; }
  .bubble {
    padding: 10px 13px; border-radius: 14px; white-space: pre-wrap; word-break: break-word; box-shadow: var(--shadow);
  }
  .msg-user .bubble { background: var(--bubble-user); border-bottom-right-radius: 4px; }
  .msg-assistant .bubble { background: none; box-shadow: none; padding: 2px 2px; white-space: normal; }
  .msg-assistant .bubble.err { color: var(--red); }
  /* rendered markdown in the assistant reply */
  .msg-assistant .bubble p { margin: 0 0 8px; }
  .msg-assistant .bubble p:last-child { margin-bottom: 0; }
  .msg-assistant .bubble ul, .msg-assistant .bubble ol { margin: 4px 0; padding-left: 20px; }
  .msg-assistant .bubble li { margin: 2px 0; }
  .msg-assistant .bubble strong { font-weight: 600; }
  .msg-assistant .bubble code {
    font-family: var(--mono); font-size: .92em; background: var(--panel-2); padding: 1px 5px; border-radius: 5px;
  }

  /* run status: plain text, no badge — click to reveal the script below it. Looks the same
     whether the run succeeded or failed; only the wording changes. */
  .msg-status { align-self: flex-start; width: 100%; max-width: 100%; }
  .msg-status > summary {
    display: flex; align-items: center; gap: 6px; list-style: none; cursor: pointer; user-select: none;
    color: var(--ink-3); padding: 2px 0;
  }
  .msg-status > summary::-webkit-details-marker { display: none; }
  .msg-status > summary .chev {
    width: 7px; height: 7px; flex: none; opacity: 0; transition: opacity .1s, transform .15s;
    border-right: 1.4px solid currentColor; border-bottom: 1.4px solid currentColor; transform: rotate(-45deg);
  }
  .msg-status > summary:hover .chev { opacity: .7; }
  .msg-status[open] > summary .chev { transform: rotate(45deg); }
  .msg-status.failed > summary { color: var(--red); }
  .tool-body {
    margin-top: 4px; background: var(--panel-2); border-radius: 8px; overflow: hidden;
  }
  .tool-body pre { margin: 0; white-space: pre; overflow: auto; max-height: 320px; tab-size: 4; font-size: 12px; font-family: var(--mono); }
  .tool-body > pre { padding: 10px 12px; }
  /* the output half (stdout/stderr/exit): distinct background, no labels, uniform font */
  .tool-body .output {
    padding: 10px 12px; background: color-mix(in srgb, var(--panel-2) 72%, var(--panel));
    display: flex; flex-direction: column; gap: 6px;
  }
  .tool-body .output pre, .tool-body .output .exit { color: var(--ink-2); font-size: 12px; font-family: var(--mono); }
  /* a group of consecutive tool calls: nested, each independently collapsible */
  .msg-group > .group-body {
    margin-top: 4px; margin-left: 3px; padding-left: 11px; border-left: 2px solid var(--line-2);
    display: flex; flex-direction: column; gap: 4px;
  }
  .msg-group > .group-body > .msg-status { width: 100%; max-width: 100%; }

  /* AppleScript highlighting */
  .hljs-keyword { color: var(--accent); }
  .hljs-string { color: var(--green); }
  .hljs-comment { color: var(--ink-3); font-style: italic; }
  .hljs-number, .hljs-literal { color: var(--accent); }
  .hljs-built_in, .hljs-type, .hljs-title, .hljs-attr { color: var(--blue); }

  /* composer: one field — textarea, model menu and send button share the same box */
  .composer {
    display: flex; align-items: flex-end; gap: 4px; width: min(760px, calc(100% - 28px)); margin: 0 0 14px;
    padding: 6px 6px 6px 14px; background: var(--panel); border: 1px solid var(--line-2); border-radius: 16px;
  }
  .composer:focus-within { border-color: var(--accent); }
  .composer textarea {
    flex: 1; resize: none; min-height: 24px; max-height: 200px; background: transparent; color: var(--ink);
    border: 0; padding: 9px 4px; font: inherit; line-height: 1.45;
  }
  .composer textarea:focus { outline: none; }
  .composer textarea::placeholder { color: var(--ink-3); }
  .model-select {
    height: 32px; flex: none; align-self: flex-end; margin-bottom: 3px; background: transparent; color: var(--ink-3);
    border: 0; padding: 0 4px; font: inherit; font-size: 11.5px; cursor: pointer;
    appearance: none; -webkit-appearance: none; -moz-appearance: none;
  }
  .model-select:focus { outline: none; color: var(--ink); }
  #send {
    width: 32px; height: 32px; padding: 0; flex: none; margin-bottom: 3px; display: grid; place-items: center;
    border: 0; border-radius: 9px; background: var(--accent); color: var(--accent-ink); cursor: pointer;
    transition: opacity .1s;
  }
  #send.hidden { visibility: hidden; pointer-events: none; }
  #send:hover { filter: brightness(1.08); }
  #send:disabled { opacity: .45; cursor: progress; }
  #send svg { width: 16px; height: 16px; }

  .messages::-webkit-scrollbar { width: 9px; }
  .messages::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 6px; }
</style>
</head>
<body>
<div class="app" id="app">
  <section class="stage">
    <iframe id="vnc" title="Sandbox screen (live VNC)" allow="clipboard-read; clipboard-write"></iframe>
    <div class="vnc-loading" id="vnc-loading"><div class="spinner"></div></div>
    <div class="vnc-disconnected hidden" id="vnc-disconnected">Disconnected</div>
    <div class="chip" id="chip" role="button" tabindex="0" title="Show system information" aria-label="Show system information">
      <span class="dot" id="dot"></span>
      <span id="chip-text">connecting…</span>
    </div>
    <a id="vnc-tab" class="vnc-tab" href="#" target="_blank" rel="noopener" hidden title="Open in a new tab" aria-label="Open in a new tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/>
      </svg>
    </a>
  </section>
  <div class="divider" id="divider" role="separator" aria-orientation="vertical" aria-label="Resize panels" tabindex="0"></div>
  <section class="chat">
    <div class="messages" id="messages"></div>
    <form class="composer" id="composer">
      <textarea id="prompt" placeholder="Write an instruction..." spellcheck="false" aria-label="Write an instruction..." rows="1"></textarea>
      <select id="model-select" class="model-select" title="Model" aria-label="Model">
        <option value="opus">Opus</option>
        <option value="sonnet">Sonnet</option>
        <option value="haiku" selected>Haiku</option>
      </select>
      <button id="send" class="hidden" type="button" title="Send (Enter)" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 19V5"/><path d="m5 12 7-7 7 7"/>
        </svg>
      </button>
    </form>
  </section>
</div>
<div class="modal-overlay hidden" id="sysinfo-overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-label="System information">
    <button class="modal-close" id="sysinfo-close" type="button" aria-label="Close">&times;</button>
    <h2>System information</h2>
    <div id="sysinfo-body"></div>
  </div>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const messages = $("messages");

  function scrollToBottom() {
    messages.scrollTop = messages.scrollHeight;
  }

  function addSystemMessage(text, isError = false) {
    const el = document.createElement("div");
    el.className = "msg msg-system" + (isError ? " err" : "");
    el.textContent = text;
    messages.appendChild(el);
    scrollToBottom();
    return el;
  }

  // A collapsible status line (the disclosure control for a tool call — click the text to
  // reveal the script/output body). Built but not attached; the caller places it.
  function createStatusDetails(text) {
    const details = document.createElement("details");
    details.className = "msg msg-status";
    details.innerHTML = `
      <summary>
        <span class="status-text"></span>
        <span class="chev"></span>
      </summary>
      <div class="tool-body"></div>`;
    details.querySelector(".status-text").textContent = text;
    return details;
  }

  // Left-aligned, persistent status line appended to the transcript (unlike addSystemMessage,
  // which is centered and used for one-off app-level notices).
  function addStatusMessage(text) {
    const details = createStatusDetails(text);
    messages.appendChild(details);
    scrollToBottom();
    return details;
  }

  // A wrapper that collapses a run of consecutive tool calls into one line ("Read screen and
  // ran scripts"); expanding it reveals each call nested inside, itself expandable.
  function createGroupDetails() {
    const details = document.createElement("details");
    details.className = "msg msg-status msg-group";
    details.innerHTML = `
      <summary>
        <span class="status-text"></span>
        <span class="chev"></span>
      </summary>
      <div class="group-body"></div>`;
    return details;
  }

  // Sets a disclosure's own summary text (the first .status-text is the element's own summary,
  // ahead of any nested children's).
  function setStatusText(details, text) {
    details.querySelector(".status-text").textContent = text;
  }

  function addUserMessage(text) {
    const wrap = document.createElement("div");
    wrap.className = "msg msg-user";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    wrap.appendChild(bubble);
    messages.appendChild(wrap);
    scrollToBottom();
  }

  function scriptHtml(script) {
    const { value } = hljs.highlight(script, { language: "applescript" });
    return `<pre><code class="hljs language-applescript">${value}</code></pre>`;
  }

  // The accessibility-tree tool returns a JSON string (already stringified and possibly
  // truncated). Pretty-print it if it parses, then syntax-highlight as JSON.
  function jsonHtml(output) {
    let text = typeof output === "string" ? output : JSON.stringify(output, null, 2);
    if (typeof output === "string") {
      try { text = JSON.stringify(JSON.parse(output), null, 2); } catch {}
    }
    if (hljs.getLanguage("json")) {
      const { value } = hljs.highlight(text, { language: "json" });
      return `<pre><code class="hljs language-json">${value}</code></pre>`;
    }
    return `<pre>${escapeHtml(text)}</pre>`;
  }

  function addAssistantMessage(text, isError = false) {
    const wrap = document.createElement("div");
    wrap.className = "msg msg-assistant";
    const bubble = document.createElement("div");
    bubble.className = "bubble" + (isError ? " err" : "");
    // The agent replies conversationally and often uses markdown; render a safe subset so
    // characters like ** and - don't show raw. Errors are plain text, kept as-is.
    if (isError) bubble.textContent = text;
    else bubble.innerHTML = renderMarkdown(text);
    wrap.appendChild(bubble);
    messages.appendChild(wrap);
    scrollToBottom();
    return bubble;
  }

  function escapeHtml(s) {
    return s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  // Render a safe subset of markdown. Input is HTML-escaped first, so the only tags in the
  // output are the fixed set introduced here — no HTML from the model reaches the DOM.
  function renderInline(text) {
    const codes = [];
    text = text.replace(/`([^`]+)`/g, (_, c) => `\uE000${codes.push(c) - 1}\uE000`);
    text = text.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    text = text.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
    text = text.replace(/(^|[^\w])_([^_\n]+)_/g, "$1<em>$2</em>");
    text = text.replace(/\uE000(\d+)\uE000/g, (_, i) => `<code>${codes[i]}</code>`);
    return text;
  }

  function renderMarkdown(md) {
    const lines = escapeHtml(md).split("\n");
    const out = [];
    let list = null;
    let para = [];
    const closeList = () => { if (list) { out.push(`</${list}>`); list = null; } };
    const flushPara = () => { if (para.length) { out.push(`<p>${para.map(renderInline).join("<br>")}</p>`); para = []; } };
    for (const raw of lines) {
      const line = raw.trim();
      if (!line) { flushPara(); closeList(); continue; }
      const h = /^#{1,6}\s+(.*)$/.exec(line);
      const ul = /^[-*]\s+(.*)$/.exec(line);
      const ol = /^\d+\.\s+(.*)$/.exec(line);
      if (h) { flushPara(); closeList(); out.push(`<p><strong>${renderInline(h[1])}</strong></p>`); }
      else if (ul) { flushPara(); if (list !== "ul") { closeList(); out.push("<ul>"); list = "ul"; } out.push(`<li>${renderInline(ul[1])}</li>`); }
      else if (ol) { flushPara(); if (list !== "ol") { closeList(); out.push("<ol>"); list = "ol"; } out.push(`<li>${renderInline(ol[1])}</li>`); }
      else { closeList(); para.push(line); }
    }
    flushPara(); closeList();
    return out.join("");
  }

  // POST to an SSE endpoint and invoke onEvent for each `data:` frame as it arrives.
  async function streamEvents(url, body, onEvent) {
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!res.ok || !res.body) {
      let data;
      try { data = JSON.parse(await res.text()); } catch {}
      throw new Error((data && data.error) || `HTTP ${res.status}`);
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let sep;
      while ((sep = buf.indexOf("\n\n")) !== -1) {
        const frame = buf.slice(0, sep);
        buf = buf.slice(sep + 2);
        const data = frame
          .split("\n")
          .filter((l) => l.startsWith("data:"))
          .map((l) => l.slice(5).replace(/^ /, ""))
          .join("\n");
        if (!data) continue;
        let ev;
        try { ev = JSON.parse(data); } catch { continue; }
        onEvent(ev);
      }
    }
  }

  // The sandbox is created on this first request; then the gateway's noVNC viewer is embedded.
  async function loadStatus() {
    const dot = $("dot");
    const vnc = $("vnc");
    const spinner = $("vnc-loading");
    const disconnected = $("vnc-disconnected");
    dot.className = "dot busy";
    $("chip-text").textContent = "connecting…";
    disconnected.classList.add("hidden");
    try {
      const res = await fetch("/api/status");
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      $("chip-text").textContent = "macOS sandbox";
      // The iframe's own "load" fires once noVNC's HTML shell is parsed, not once it has
      // connected and is painting frames — the page is cross-origin, so there's no signal
      // for that, and no way to reach into its DOM to hide its own connecting-state UI
      // (a status badge that briefly renders empty before its text fills in). This delay
      // is a heuristic buffer to bridge past both before we reveal the iframe.
      vnc.addEventListener("load", () => setTimeout(() => spinner.classList.add("hidden"), 2000), { once: true });
      vnc.src = data.vncUrl;
      $("vnc-tab").href = data.vncUrl;
      $("vnc-tab").hidden = false;
      dot.className = "dot on";
    } catch (err) {
      dot.className = "dot err";
      $("chip-text").textContent = "Disconnected";
      spinner.classList.add("hidden");
      disconnected.classList.remove("hidden");
      addSystemMessage(`Couldn't connect to a sandbox: ${err.message}`, true);
    }
  }

  function bytesToGB(value) {
    const n = Number(value);
    return Number.isFinite(n) ? `${(n / 1e9).toFixed(1)} GB` : value;
  }

  function renderSysinfo(info) {
    const rows = [
      ["macOS", `${info.product} ${info.version} (${info.build})`],
      ["Model", info.model],
      ["Chip", info.arch],
      ["CPUs", info.cpus],
      ["Memory", bytesToGB(info.memBytes)],
      ["Hostname", info.hostname],
      ["Uptime", info.uptime],
    ];
    return `<dl>${rows.map(([k, v]) => `<dt>${escapeHtml(k)}</dt><dd>${escapeHtml(String(v ?? ""))}</dd>`).join("")}</dl>`;
  }

  let sysinfoCache = null;

  // Full-page modal with live system info, read from the sandbox over SSH on first open.
  async function openSysinfo() {
    $("sysinfo-overlay").classList.remove("hidden");
    if (sysinfoCache) {
      $("sysinfo-body").innerHTML = renderSysinfo(sysinfoCache);
      return;
    }
    $("sysinfo-body").innerHTML = `<div class="note">Reading system info…</div>`;
    try {
      const res = await fetch("/api/sysinfo");
      const text = await res.text();
      let data;
      try {
        data = JSON.parse(text);
      } catch {
        throw new Error(`Unexpected response from the server (HTTP ${res.status})`);
      }
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      sysinfoCache = data;
      $("sysinfo-body").innerHTML = renderSysinfo(data);
    } catch (err) {
      $("sysinfo-body").innerHTML = `<div class="note">${escapeHtml(err.message)}</div>`;
    }
  }

  function closeSysinfo() {
    $("sysinfo-overlay").classList.add("hidden");
  }

  // The output half of an AppleScript bubble: stdout, stderr and the exit code, no labels, all in
  // one distinct-background block. Each piece is shown only when there's something to show.
  function execHtml(output) {
    if (!output || typeof output !== "object") return "";
    const parts = [];
    const stdout = (output.stdout || "").trim();
    const stderr = (output.stderr || "").trim();
    if (stdout) parts.push(`<pre>${escapeHtml(stdout)}</pre>`);
    if (stderr) parts.push(`<pre>${escapeHtml(stderr)}</pre>`);
    if (typeof output.exitCode === "number") parts.push(`<div class="exit">exit ${output.exitCode}</div>`);
    return parts.length ? `<div class="output">${parts.join("")}</div>` : "";
  }

  // A plain-text output half (used for a tool-execution error under the script).
  function outputText(text) {
    return `<div class="output"><pre>${escapeHtml(text)}</pre></div>`;
  }

  // The model's own present-tense description of a step ("Opening TextEdit…"), falling back to a
  // generic label if it didn't provide one.
  function stepLabel(tool, input) {
    return (input && input.summary) || (tool === "run_applescript" ? "Running script…" : "Reading screen…");
  }

  // Render one status line per tool call the agent made. Same disclosure component either way:
  // a run_applescript step reveals the script and its output; a read_accessibility_tree step
  // reveals the returned JSON. Either can also carry a tool-execution error. The label stays the
  // model's step summary; failure is shown by coloring it (and the error/exit code in the body).
  function fillStatusStep(details, step) {
    const body = details.querySelector(".tool-body");
    setStatusText(details, stepLabel(step.tool, step.input));
    if (step.tool === "run_applescript") {
      const script = (step.input && step.input.script) || "";
      const failed = !!step.error || (step.output && step.output.exitCode !== 0);
      details.classList.toggle("failed", failed);
      body.innerHTML = step.error
        ? scriptHtml(script) + outputText(String(step.error))
        : scriptHtml(script) + execHtml(step.output);
    } else {
      details.classList.toggle("failed", !!step.error);
      body.innerHTML = step.error ? `<pre>${escapeHtml(String(step.error))}</pre>` : jsonHtml(step.output);
    }
  }

  // A tool call that has started but not yet returned. The model's step summary is shown right
  // away as the label; the script body shows immediately so you can watch it run.
  function renderToolPending(details, tool, input) {
    const body = details.querySelector(".tool-body");
    setStatusText(details, stepLabel(tool, input));
    if (tool === "run_applescript") {
      body.innerHTML = scriptHtml((input && input.script) || "");
    } else {
      body.innerHTML = "";
    }
  }

  // Stream the agent's turn: each tool call becomes a status line the moment it starts (filled in
  // when its result arrives) and the reply types in live — everything in chronological order.
  async function send() {
    const text = $("prompt").value.trim();
    const model = $("model-select").value;
    if (!text) return;

    addUserMessage(text);
    $("prompt").value = "";
    $("prompt").style.height = "auto";
    $("send").classList.add("hidden");
    $("send").disabled = true;

    const tools = new Map(); // toolCallId -> { details, tool, input }
    let thinking = addStatusMessage("Working…");
    let reply = null; // the current assistant bubble being streamed into
    let replyText = "";
    let gotContent = false;
    // A run of consecutive tool calls, collapsed into one group once there are two or more.
    let run = null; // { children: [entry...], group: <details>|null }
    const clearThinking = () => { if (thinking) { thinking.remove(); thinking = null; } };
    const endRun = () => { run = null; };

    // Place a new tool-call line. The first in a run sits at top level; the second promotes the
    // pair into a group (moving the first inside); later ones append to that group.
    function addToolCall(entry) {
      const child = createStatusDetails("Working…");
      entry.details = child;
      renderToolPending(child, entry.tool, entry.input);
      if (!run) {
        messages.appendChild(child);
        run = { children: [entry], group: null };
      } else if (!run.group) {
        const group = createGroupDetails();
        const first = run.children[0].details;
        messages.insertBefore(group, first);
        const gb = group.querySelector(".group-body");
        gb.appendChild(first);
        gb.appendChild(child);
        run.group = group;
        run.children.push(entry);
        setStatusText(group, stepLabel(entry.tool, entry.input));
      } else {
        run.group.querySelector(".group-body").appendChild(child);
        run.children.push(entry);
        setStatusText(run.group, stepLabel(entry.tool, entry.input));
      }
      scrollToBottom();
    }

    try {
      await streamEvents("/api/stream", { prompt: text, model }, (ev) => {
        switch (ev.t) {
          case "tool-call": {
            gotContent = true;
            clearThinking();
            reply = null; replyText = ""; // a following reply starts a fresh bubble below this run
            const entry = { id: ev.id, tool: ev.tool, input: ev.input };
            addToolCall(entry);
            tools.set(ev.id, entry);
            break;
          }
          case "tool-result": {
            const e = tools.get(ev.id);
            if (e) fillStatusStep(e.details, { tool: e.tool, input: e.input, output: ev.output });
            break;
          }
          case "tool-error": {
            const e = tools.get(ev.id);
            if (e) fillStatusStep(e.details, { tool: e.tool, input: e.input, error: ev.error });
            break;
          }
          case "text": {
            gotContent = true;
            clearThinking();
            endRun(); // narration ends the current run of tool calls
            if (!reply) reply = addAssistantMessage("");
            replyText += ev.text;
            reply.innerHTML = renderMarkdown(replyText);
            scrollToBottom();
            break;
          }
          case "error": {
            gotContent = true;
            clearThinking();
            endRun();
            addAssistantMessage(ev.error, true);
            break;
          }
        }
      });
      clearThinking();
      if (!gotContent) addAssistantMessage("Done.");
    } catch (err) {
      clearThinking();
      addAssistantMessage(err.message, true);
    } finally {
      $("send").disabled = false;
      $("prompt").focus();
    }
  }

  $("send").addEventListener("click", send);
  $("prompt").addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    e.preventDefault();
    if (e.ctrlKey || e.metaKey || e.shiftKey) {
      const ta = e.target;
      ta.setRangeText("\n", ta.selectionStart, ta.selectionEnd, "end");
      return;
    }
    if (!$("send").disabled) send();
  });
  $("prompt").addEventListener("input", (e) => {
    e.target.style.height = "auto";
    e.target.style.height = Math.min(e.target.scrollHeight, 200) + "px";
    $("send").classList.toggle("hidden", !e.target.value.trim());
  });

  $("chip").addEventListener("click", openSysinfo);
  $("chip").addEventListener("keydown", (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    e.preventDefault();
    openSysinfo();
  });
  $("sysinfo-close").addEventListener("click", closeSysinfo);
  $("sysinfo-overlay").addEventListener("click", (e) => {
    if (e.target === $("sysinfo-overlay")) closeSysinfo();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !$("sysinfo-overlay").classList.contains("hidden")) closeSysinfo();
  });

  loadStatus();

  // ---------- draggable divider ----------
  // Pointer capture keeps move/up events targeted at the divider even while the
  // pointer is over the cross-origin VNC iframe, so no full-page overlay is needed.
  (function setupDivider() {
    const app = $("app");
    const divider = $("divider");
    const stackedQuery = window.matchMedia("(max-width: 860px)");
    const isStacked = () => stackedQuery.matches;
    const MIN = 160; // px kept clear on each side

    try {
      const col = localStorage.getItem("mac-state-split-col");
      const row = localStorage.getItem("mac-state-split-row");
      if (col) app.style.setProperty("--split-col", col);
      if (row) app.style.setProperty("--split-row", row);
    } catch {}

    let dragging = false;

    function onMove(e) {
      if (!dragging) return;
      const rect = app.getBoundingClientRect();
      if (isStacked()) {
        const h = Math.min(Math.max(e.clientY - rect.top, MIN), rect.height - MIN - 6);
        app.style.setProperty("--split-row", `${h}px`);
      } else {
        const w = Math.min(Math.max(e.clientX - rect.left, MIN), rect.width - MIN - 6);
        app.style.setProperty("--split-col", `${w}px`);
      }
    }

    function onUp(e) {
      if (!dragging) return;
      dragging = false;
      divider.classList.remove("dragging");
      divider.releasePointerCapture(e.pointerId);
      try {
        if (isStacked()) localStorage.setItem("mac-state-split-row", app.style.getPropertyValue("--split-row"));
        else localStorage.setItem("mac-state-split-col", app.style.getPropertyValue("--split-col"));
      } catch {}
    }

    divider.addEventListener("pointerdown", (e) => {
      dragging = true;
      divider.classList.add("dragging");
      divider.setPointerCapture(e.pointerId);
    });
    divider.addEventListener("pointermove", onMove);
    divider.addEventListener("pointerup", onUp);
    divider.addEventListener("pointercancel", onUp);

    // Double-click resets to the default split.
    divider.addEventListener("dblclick", () => {
      app.style.removeProperty("--split-col");
      app.style.removeProperty("--split-row");
      try {
        localStorage.removeItem("mac-state-split-col");
        localStorage.removeItem("mac-state-split-row");
      } catch {}
    });

    // Arrow keys nudge the split for keyboard users.
    divider.addEventListener("keydown", (e) => {
      const step = 24;
      const stacked = isStacked();
      const grow = stacked ? e.key === "ArrowDown" : e.key === "ArrowRight";
      const shrink = stacked ? e.key === "ArrowUp" : e.key === "ArrowLeft";
      if (!grow && !shrink) return;
      e.preventDefault();
      const rect = app.getBoundingClientRect();
      const prop = stacked ? "--split-row" : "--split-col";
      const size = stacked ? rect.height : rect.width;
      const current = parseFloat(getComputedStyle(app).getPropertyValue(prop)) || size * (stacked ? 0.42 : 0.58);
      const next = Math.min(Math.max(current + (grow ? step : -step), MIN), size - MIN - 6);
      app.style.setProperty(prop, `${next}px`);
      try { localStorage.setItem(stacked ? "mac-state-split-row" : "mac-state-split-col", `${next}px`); } catch {}
    });
  })();
</script>
</body>
</html>
