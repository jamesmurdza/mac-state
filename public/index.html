<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mac-state</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/applescript.min.js"></script>
<style>
  :root {
    --bg: #f6f3ee; --panel: #ffffff; --panel-2: #efeae1;
    --line: #e4ddd0; --line-2: #d9cfbd;
    --ink: #211b12; --ink-2: #6e6455; --ink-3: #a89c88;
    --accent: #b9700a; --accent-ink: #ffffff;
    --red: #b8402c; --green: #2f8f52; --blue: #2f6fb0;
    --bubble-user: #eee5d6; --bubble-assistant: #ffffff;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --shadow: 0 1px 2px rgba(30, 24, 12, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #100f0d; --panel: #1a1815; --panel-2: #221f1a;
      --line: #2c2823; --line-2: #3a342c;
      --ink: #ece6da; --ink-2: #a89f91; --ink-3: #6f675c;
      --accent: #f0a830; --accent-ink: #1a1205;
      --red: #f0796a; --green: #7fd68a; --blue: #8ec5ff;
      --bubble-user: #262219; --bubble-assistant: #1a1815;
      --shadow: 0 1px 2px rgba(0, 0, 0, .5);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--ink); font: 13px/1.55 var(--mono); background: var(--bg);
  }
  .app { display: grid; grid-template-columns: minmax(280px, var(--split-col, 58%)) 6px minmax(320px, 1fr); height: 100vh; }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; grid-template-rows: minmax(160px, var(--split-row, 42vh)) 6px minmax(160px, 1fr); height: 100vh; }
  }

  /* ---------- divider: thin line, wider drag target ---------- */
  .divider { position: relative; background: transparent; z-index: 5; touch-action: none; }
  .divider::after {
    content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; transform: translateX(-50%);
    background: var(--line-2);
  }
  .divider:hover::after, .divider.dragging::after { background: var(--accent); }
  .divider { cursor: col-resize; }
  @media (max-width: 860px) {
    .divider { cursor: row-resize; }
    .divider::after { top: 50%; left: 0; right: 0; bottom: auto; width: auto; height: 1px; transform: translateY(-50%); }
  }

  /* ---------- left: VNC stage ---------- */
  .stage { position: relative; background: #000; display: flex; min-width: 0; min-height: 0; }
  .stage iframe { flex: 1; width: 100%; height: 100%; border: 0; background: #000; }
  .chip {
    position: absolute; top: 12px; left: 12px; display: flex; align-items: center; gap: 8px;
    background: rgba(20, 18, 14, .72); backdrop-filter: blur(6px); color: #ece6da;
    border: 1px solid rgba(255, 255, 255, .1); border-radius: 20px; padding: 6px 12px 6px 10px;
    font-size: 11px; letter-spacing: .01em;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); flex: none; }
  .dot.busy { background: var(--accent); animation: pulse .9s infinite alternate; }
  .dot.on { background: var(--green); }
  .dot.err { background: var(--red); }
  @keyframes pulse { from { opacity: .35 } to { opacity: 1 } }
  .chip a { color: inherit; opacity: .7; text-decoration: none; margin-left: 2px; }
  .chip a:hover { opacity: 1; }

  /* ---------- right: chat ---------- */
  .chat { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }
  .messages { flex: 1; overflow-y: auto; padding: 18px 16px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 92%; }
  .msg-system { align-self: center; max-width: 100%; color: var(--ink-3); font-size: 11px; text-align: center; padding: 2px 0; }
  .msg-system.err { color: var(--red); }
  .msg-user { align-self: flex-end; }
  .msg-assistant, .msg-tool { align-self: flex-start; }
  .bubble {
    padding: 10px 13px; border-radius: 14px; white-space: pre-wrap; word-break: break-word; box-shadow: var(--shadow);
  }
  .msg-user .bubble { background: var(--bubble-user); border-bottom-right-radius: 4px; }
  .msg-assistant .bubble { background: var(--bubble-assistant); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg-assistant .bubble.err { color: var(--red); border-color: var(--red); }
  .msg-user .bubble.raw { font-size: 12px; }

  /* tool call: expandable AppleScript block */
  .tool { width: 100%; }
  .tool > summary {
    display: flex; align-items: center; gap: 8px; list-style: none; cursor: pointer; user-select: none;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px;
    font-size: 11.5px; color: var(--ink-2);
  }
  .tool > summary::-webkit-details-marker { display: none; }
  .tool > summary .chev { width: 9px; height: 9px; flex: none; border-right: 1.6px solid var(--ink-3); border-bottom: 1.6px solid var(--ink-3); transform: rotate(-45deg); transition: transform .15s; }
  .tool[open] > summary .chev { transform: rotate(45deg); }
  .tool > summary .tool-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); flex: none; }
  .tool > summary .tool-dot.ok { background: var(--green); }
  .tool > summary .tool-dot.bad { background: var(--red); }
  .tool > summary .tool-dot.pending { background: var(--accent); animation: pulse .9s infinite alternate; }
  .tool > summary .label { font-weight: 600; color: var(--ink); }
  .tool > summary .model { color: var(--ink-3); font-size: 10.5px; margin-left: auto; }
  .tool-body {
    border: 1px solid var(--line); border-top: 0; border-radius: 0 0 10px 10px; background: var(--panel-2);
    padding: 10px 12px; margin-top: -1px;
  }
  .tool-body pre { margin: 0; white-space: pre; overflow-x: auto; tab-size: 4; font-size: 12px; }
  .tool-body .stream { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
  .tool-body .stream h4 { margin: 0 0 4px; font: 500 9.5px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
  .tool-body .stream pre { white-space: pre-wrap; word-break: break-word; }
  .tool-body .stderr pre { color: var(--red); }
  .tool-body .exit { margin-top: 8px; font-size: 11px; color: var(--ink-3); }
  .tool-body .exit b.ok { color: var(--green); }
  .tool-body .exit b.bad { color: var(--red); }

  /* AppleScript highlighting */
  .hljs-keyword { color: var(--accent); }
  .hljs-string { color: var(--green); }
  .hljs-comment { color: var(--ink-3); font-style: italic; }
  .hljs-number, .hljs-literal { color: var(--accent); }
  .hljs-built_in, .hljs-type, .hljs-title { color: var(--blue); }

  /* composer */
  .composer { display: flex; align-items: flex-end; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--line); background: var(--bg); }
  .composer textarea {
    flex: 1; resize: none; min-height: 40px; max-height: 200px; background: var(--panel); color: var(--ink);
    border: 1px solid var(--line-2); border-radius: 10px; padding: 10px 12px; font: inherit; line-height: 1.45;
  }
  .composer textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  .composer textarea::placeholder { color: var(--ink-3); }
  .raw-toggle { display: flex; align-items: center; gap: 5px; color: var(--ink-3); font-size: 10.5px; padding: 0 2px 6px; cursor: pointer; white-space: nowrap; }
  .raw-toggle input { accent-color: var(--accent); margin: 0; }
  #send {
    width: 38px; height: 38px; padding: 0; flex: none; display: grid; place-items: center;
    border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); cursor: pointer;
  }
  #send:hover { filter: brightness(1.08); }
  #send:disabled { opacity: .45; cursor: progress; }
  #send svg { width: 17px; height: 17px; }

  .messages::-webkit-scrollbar { width: 9px; }
  .messages::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 6px; }
</style>
</head>
<body>
<div class="app" id="app">
  <section class="stage">
    <iframe id="vnc" title="Sandbox screen (live VNC)" allow="clipboard-read; clipboard-write"></iframe>
    <div class="chip">
      <span class="dot" id="dot"></span>
      <span id="chip-text">connecting…</span>
      <a id="vnc-tab" href="#" target="_blank" rel="noopener" hidden title="Open in a new tab">↗</a>
    </div>
  </section>
  <div class="divider" id="divider" role="separator" aria-orientation="vertical" aria-label="Resize panels" tabindex="0"></div>
  <section class="chat">
    <div class="messages" id="messages"></div>
    <form class="composer" id="composer">
      <textarea id="prompt" placeholder="What should the Mac do?" spellcheck="false" aria-label="What should the Mac do?" rows="1"></textarea>
      <label class="raw-toggle"><input type="checkbox" id="raw"> script</label>
      <button id="send" type="button" title="Send (Enter)" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 5v6a3 3 0 0 1-3 3H6"/><path d="m9 10-4 4 4 4"/>
        </svg>
      </button>
    </form>
  </section>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const messages = $("messages");

  function scrollToBottom() {
    messages.scrollTop = messages.scrollHeight;
  }

  function addSystemMessage(text, isError = false) {
    const el = document.createElement("div");
    el.className = "msg msg-system" + (isError ? " err" : "");
    el.textContent = text;
    messages.appendChild(el);
    scrollToBottom();
    return el;
  }

  function addUserMessage(text, raw) {
    const wrap = document.createElement("div");
    wrap.className = "msg msg-user";
    const bubble = document.createElement("div");
    bubble.className = "bubble" + (raw ? " raw" : "");
    bubble.textContent = text;
    wrap.appendChild(bubble);
    messages.appendChild(wrap);
    scrollToBottom();
  }

  // Pending tool call, filled in once the run finishes.
  function addPendingTool() {
    const details = document.createElement("details");
    details.className = "tool";
    details.innerHTML = `
      <summary>
        <span class="tool-dot pending"></span>
        <span class="label">AppleScript</span>
        <span class="model">running…</span>
        <span class="chev"></span>
      </summary>
      <div class="tool-body"><pre>generating…</pre></div>`;
    const wrap = document.createElement("div");
    wrap.className = "msg msg-tool";
    wrap.appendChild(details);
    messages.appendChild(wrap);
    scrollToBottom();
    return details;
  }

  function friendlyModel(model) {
    return model.startsWith("none") ? "raw script" : model;
  }

  function fillTool(details, { script, model, stdout, stderr, exitCode }) {
    const ok = exitCode === 0;
    details.querySelector(".tool-dot").className = "tool-dot " + (ok ? "ok" : "bad");
    details.querySelector(".model").textContent = friendlyModel(model);
    const { value } = hljs.highlight(script, { language: "applescript" });
    let body = `<pre><code class="hljs language-applescript">${value}</code></pre>`;
    if (stdout && stdout.trim()) {
      body += `<div class="stream stdout"><h4>stdout</h4><pre>${escapeHtml(stdout)}</pre></div>`;
    }
    if (stderr && stderr.trim()) {
      body += `<div class="stream stderr"><h4>stderr</h4><pre>${escapeHtml(stderr)}</pre></div>`;
    }
    body += `<div class="exit">exit <b class="${ok ? "ok" : "bad"}">${exitCode}</b></div>`;
    details.querySelector(".tool-body").innerHTML = body;
  }

  function toolError(details, message) {
    details.querySelector(".tool-dot").className = "tool-dot bad";
    details.querySelector(".model").textContent = "failed";
    details.querySelector(".tool-body").innerHTML = `<pre>${escapeHtml(message)}</pre>`;
  }

  function addAssistantMessage(text, isError = false) {
    const wrap = document.createElement("div");
    wrap.className = "msg msg-assistant";
    const bubble = document.createElement("div");
    bubble.className = "bubble" + (isError ? " err" : "");
    bubble.textContent = text;
    wrap.appendChild(bubble);
    messages.appendChild(wrap);
    scrollToBottom();
  }

  function escapeHtml(s) {
    return s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  // The sandbox is created on this first request; then the gateway's noVNC viewer is embedded.
  async function loadStatus() {
    const dot = $("dot");
    dot.className = "dot busy";
    $("chip-text").textContent = "connecting…";
    try {
      const res = await fetch("/api/status");
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      $("chip-text").textContent = `${data.sandboxId} · ${data.host}`;
      $("vnc").src = data.vncUrl;
      $("vnc-tab").href = data.vncUrl;
      $("vnc-tab").hidden = false;
      dot.className = "dot on";
      addSystemMessage(`Connected to ${data.sandboxId} · ${data.host}`);
    } catch (err) {
      dot.className = "dot err";
      $("chip-text").textContent = "no sandbox";
      addSystemMessage(`Couldn't connect to a sandbox: ${err.message}`, true);
    }
  }

  // Unchecked: the text is a prompt and Claude writes the script. Checked: the text is the script.
  async function send() {
    const text = $("prompt").value.trim();
    const raw = $("raw").checked;
    if (!text) return;

    addUserMessage(text, raw);
    $("prompt").value = "";
    $("prompt").style.height = "auto";
    $("send").disabled = true;
    const tool = addPendingTool();

    try {
      const res = await fetch("/api/run", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(raw ? { script: text } : { prompt: text }),
      });
      const data = await res.json();
      if (!res.ok) {
        toolError(tool, data.error);
        addAssistantMessage(data.error, true);
        return;
      }
      fillTool(tool, data);
      if (data.exitCode === 0) {
        addAssistantMessage(data.stdout.trim() || "Done.");
      } else {
        addAssistantMessage(data.stderr.trim() || `Script failed (exit ${data.exitCode})`, true);
      }
    } catch (err) {
      toolError(tool, err.message);
      addAssistantMessage(err.message, true);
    } finally {
      $("send").disabled = false;
      $("prompt").focus();
    }
  }

  $("send").addEventListener("click", send);
  $("prompt").addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    e.preventDefault();
    if (e.ctrlKey || e.metaKey || e.shiftKey) {
      const ta = e.target;
      ta.setRangeText("\n", ta.selectionStart, ta.selectionEnd, "end");
      return;
    }
    if (!$("send").disabled) send();
  });
  $("prompt").addEventListener("input", (e) => {
    e.target.style.height = "auto";
    e.target.style.height = Math.min(e.target.scrollHeight, 200) + "px";
  });

  loadStatus();

  // ---------- draggable divider ----------
  // Pointer capture keeps move/up events targeted at the divider even while the
  // pointer is over the cross-origin VNC iframe, so no full-page overlay is needed.
  (function setupDivider() {
    const app = $("app");
    const divider = $("divider");
    const stackedQuery = window.matchMedia("(max-width: 860px)");
    const isStacked = () => stackedQuery.matches;
    const MIN = 160; // px kept clear on each side

    try {
      const col = localStorage.getItem("mac-state-split-col");
      const row = localStorage.getItem("mac-state-split-row");
      if (col) app.style.setProperty("--split-col", col);
      if (row) app.style.setProperty("--split-row", row);
    } catch {}

    let dragging = false;

    function onMove(e) {
      if (!dragging) return;
      const rect = app.getBoundingClientRect();
      if (isStacked()) {
        const h = Math.min(Math.max(e.clientY - rect.top, MIN), rect.height - MIN - 6);
        app.style.setProperty("--split-row", `${h}px`);
      } else {
        const w = Math.min(Math.max(e.clientX - rect.left, MIN), rect.width - MIN - 6);
        app.style.setProperty("--split-col", `${w}px`);
      }
    }

    function onUp(e) {
      if (!dragging) return;
      dragging = false;
      divider.classList.remove("dragging");
      divider.releasePointerCapture(e.pointerId);
      try {
        if (isStacked()) localStorage.setItem("mac-state-split-row", app.style.getPropertyValue("--split-row"));
        else localStorage.setItem("mac-state-split-col", app.style.getPropertyValue("--split-col"));
      } catch {}
    }

    divider.addEventListener("pointerdown", (e) => {
      dragging = true;
      divider.classList.add("dragging");
      divider.setPointerCapture(e.pointerId);
    });
    divider.addEventListener("pointermove", onMove);
    divider.addEventListener("pointerup", onUp);
    divider.addEventListener("pointercancel", onUp);

    // Double-click resets to the default split.
    divider.addEventListener("dblclick", () => {
      app.style.removeProperty("--split-col");
      app.style.removeProperty("--split-row");
      try {
        localStorage.removeItem("mac-state-split-col");
        localStorage.removeItem("mac-state-split-row");
      } catch {}
    });

    // Arrow keys nudge the split for keyboard users.
    divider.addEventListener("keydown", (e) => {
      const step = 24;
      const stacked = isStacked();
      const grow = stacked ? e.key === "ArrowDown" : e.key === "ArrowRight";
      const shrink = stacked ? e.key === "ArrowUp" : e.key === "ArrowLeft";
      if (!grow && !shrink) return;
      e.preventDefault();
      const rect = app.getBoundingClientRect();
      const prop = stacked ? "--split-row" : "--split-col";
      const size = stacked ? rect.height : rect.width;
      const current = parseFloat(getComputedStyle(app).getPropertyValue(prop)) || size * (stacked ? 0.42 : 0.58);
      const next = Math.min(Math.max(current + (grow ? step : -step), MIN), size - MIN - 6);
      app.style.setProperty(prop, `${next}px`);
      try { localStorage.setItem(stacked ? "mac-state-split-row" : "mac-state-split-col", `${next}px`); } catch {}
    });
  })();
</script>
</body>
</html>
